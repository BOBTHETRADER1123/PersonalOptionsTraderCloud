services:
  - type: web
    name: personal-options-trader-api
    runtime: docker
    plan: 0.5c-512mb
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: trader-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PORT
        value: "10000"
      - key: APP_SECRET
        generateValue: true
      - key: APP_PASSWORD
        sync: false
      - key: APP_PASSWORD_HASH
        value: ""
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: personal-options-trader-db
          property: connectionString
      - key: DATA_DIR
        value: /data/OptionsTraderData
      - key: CORS_ORIGINS
        value: ""
      - key: LIVE_TRADING_ENABLED
        value: "false"
      - key: FEED_UNDERLYINGS
        value: NIFTY,BANKNIFTY,SENSEX,GOLD,GOLDM,GOLDPETAL,SILVER,SILVERM,SILVERMIC,CRUDEOIL,CRUDEOILM,NATURALGAS,NATGASMINI,COPPER,ZINC,ALUMINIUM,LEAD,NICKEL

databases:
  - name: personal-options-trader-db
    plan: 0.5c-1g
    region: singapore
    postgresMajorVersion: "16"
    databaseName: options
    user: options
